name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # docs repo checked out at ./honba-docs
      - uses: actions/checkout@v4
        with:
          path: honba-docs

      # sibling checkout so mkdocstrings paths: ../honba-tamashii/python/honba resolves
      - uses: actions/checkout@v4
        with:
          repository: honba-labs/honba-tamashii
          path: honba-tamashii

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install docs deps
        working-directory: honba-docs
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: mkdocs build --strict
        working-directory: honba-docs
        run: |
          set -euo pipefail
          mkdocs build --strict

      - name: docs conformance check
        working-directory: honba-docs
        run: |
          set -euo pipefail
          python scripts/verify_conformance.py --strict

      - name: upload mkdocs site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: honba-docs/site/

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: mdbook build
        working-directory: honba-docs
        run: |
          set -euo pipefail
          mdbook build book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: honba-docs

      - name: download mkdocs site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: honba-docs/site/

      - name: Deploy mkdocs site to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: honba-docs/site
          keep_files: false
