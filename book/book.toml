[book]
title = "Honba — Internals"
authors = ["Honba Labs"]
language = "en"
src = "src"

[build]
build-dir = "build"
create-missing = false

#[preprocessor.rustdoc-links]
# Points at the Rust workspace, not the book
#manifest-path = "../honba/Cargo.toml"

#[output.linkcheck]
# Only warn on broken external links while the site is new
#warning-policy = "warn"
#follow-web-links = false
